<style>
  /* すべてのマージンとパディングをリセット */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    /* すべての要素にボックスサイズを適用 */
  }

  /* HTMLとBODYタグのスタイルをリセット */
  html,
  body {
    height: 100%;
    width: 100%;
    margin: 0;
    /* bodyタグのデフォルトの余白を消す */
    padding: 0;
    /* もしあれば、パディングを消す */
  }
</style>
